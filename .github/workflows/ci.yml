name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:dependencies
      - run: pnpm check:security
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:skill-docs
      - run: pnpm check:unique-fingerprints
      - run: pnpm check:package
      - run: node dist/cli.js check .
      - run: node dist/cli.js doctor . --deep

name: Bug report
description: The CLI, installer, or skill did something wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If a specific finding is a false positive or a missed issue, use the **Finding is wrong** template instead. Report security problems privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or chat prompts, ideally against a minimal repository.
      placeholder: |
        1. npx --yes --package github:sethmgibson/coherent -- coherent install --skills-only --yes
        2. coherent audit . --evidence --rules A08
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages or command output. This will be rendered as code.
      render: text
  - type: textarea
    id: version
    attributes:
      label: Coherent version
      description: Paste the output of `coherent version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - CLI (audit, check, baseline, doctor, review, ...)
        - Installer (install / update)
        - Skill in Codex
        - Skill in Cursor
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, package manager, and Python version if relevant.
      placeholder: macOS 15, Node 22.11, pnpm 10.13, Python 3.12
